name: CI / Production Build Validation

on:
  push:
    branches: [main, production-hardening]
  pull_request:
    branches: [main, production-hardening]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-validation:
    name: Frontend (Next.js 16 / TypeScript / ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Build production bundle
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.smartstudy.edu/api/v1
          NEXT_PUBLIC_DEMO_MODE: "false"
        run: npm run build

  backend-validation:
    name: Backend (Spring Boot 3.4.2 / Java 21 / Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and run test suite
        run: mvn -B test-compile

      - name: Package production JAR (excluding database tests)
        run: mvn -B package -DskipTests

      - name: Validate Dockerfile syntax
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: smart-study-backend:ci-test

  ml-validation:
    name: ML Engine (FastAPI / Python 3.12 / Vector Store)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies for PyMuPDF & OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 tesseract-ocr tesseract-ocr-eng

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit test suite
        run: |
          python -m unittest tests/test_service.py
          python -m unittest tests/test_tutor_quality.py

      - name: Validate Dockerfile syntax
        uses: docker/build-push-action@v5
        with:
          context: ./ml
          push: false
          tags: smart-study-ml:ci-test

  config-integrity:
    name: Environment & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Audit for secret leakage in frontend bundles
        run: |
          echo "Scanning frontend repository for exposed secrets..."
          if grep -rn "sk-or-v1-" frontend/; then
            echo "ERROR: Discovered unhashed OpenRouter API key in frontend code!"
            exit 1
          fi
          if grep -rn "tvly-" frontend/; then
            echo "ERROR: Discovered Tavily API key in frontend code!"
            exit 1
          fi
          echo "Zero secret credentials detected in frontend."

      - name: Audit environment variable example completeness
        run: |
          test -f frontend/.env.example || { echo "frontend/.env.example missing"; exit 1; }
          test -f backend/.env.production.example || { echo "backend/.env.production.example missing"; exit 1; }
          test -f ml/.env.production.example || { echo "ml/.env.production.example missing"; exit 1; }
          echo "All environment templates present."

